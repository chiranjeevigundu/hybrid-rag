name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      # The real thing, not a stub. The store tests assert on pgvector operator
      # behaviour and HNSW ordering, neither of which a fake would reproduce.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # [dev] only — no fastembed. The suite runs against HashingEmbedder, so CI
        # needs no model download and stays fast. The one test that needs real
        # weights is marked `model` and excluded below.
        run: pip install -e ".[dev]"

      - name: Test
        env:
          # conftest derives a `_test` database from this and creates it on demand,
          # so the suite never drops the schema the e2e step below indexes into.
          DATABASE_URL: postgresql://rag:rag@localhost:5433/rag
        run: pytest -q -m "not model"

      - name: Tests must not have touched the working database
        # Guards the isolation directly. If conftest ever stopped deriving a separate
        # database, this is the step that notices, rather than a developer losing an
        # index and not connecting it to having run the suite.
        env:
          PGPASSWORD: rag
        run: |
          set -euo pipefail
          both=$(psql -h localhost -p 5433 -U rag -d postgres -tAc \
            "SELECT count(*) FROM pg_database WHERE datname IN ('rag','rag_test');")
          [ "$both" = "2" ] || { echo "expected both rag and rag_test to exist, found $both"; exit 1; }
          echo "ok: rag and rag_test are separate databases"

      - name: The schema must match the model's dimension
        # A mismatch between vector(N) in the migration and the embedder's output is
        # a runtime insert failure, not an import error, so nothing else catches it.
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5433/rag
        run: |
          python - <<'PY'
          import re, pathlib
          from ragkit.config import DEFAULT_DIM
          sql = pathlib.Path("migrations/001_schema.sql").read_text()
          declared = int(re.search(r"embedding\s+vector\((\d+)\)", sql).group(1))
          assert declared == DEFAULT_DIM, f"schema says vector({declared}), config says {DEFAULT_DIM}"
          print(f"ok: both agree on {declared} dimensions")
          PY

      - name: End to end — index and search a real corpus
        # Proves the CLI path a new user actually runs, which unit tests do not cover.
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5433/rag
          RAG_MODEL: hashing
        run: |
          set -euo pipefail
          python -m ragkit init
          python -m ragkit index corpus
          python -m ragkit stats
          # Re-running must skip everything: the incremental path is the difference
          # between a scheduled re-index costing seconds and costing a full re-embed.
          out=$(python -m ragkit index corpus)
          echo "$out"
          echo "$out" | grep -qE 'indexed +0' || { echo "re-index did not skip unchanged files"; exit 1; }
          python -m ragkit search "refund window" -k 3
