# Postgres with pgvector. Port 5433 on the host, not 5432, so this can run beside a
# default local Postgres without a clash.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - ragdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns success while the server is still starting, so the
      # check runs a real query against the target database instead.
      test: ["CMD-SHELL", "psql -U rag -d rag -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ragdata:
