[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "Hybrid retrieval (BM25 + dense) with reranking and a measured eval harness. No API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # Postgres driver. psycopg3 for native `executemany` batching and real
    # transaction context managers.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Split out so the core package stays importable — and unit-testable — without
# pulling ONNX Runtime. CI installs [dev] only and runs against HashingEmbedder.
embed = ["fastembed>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ragkit = "ragkit.cli:main"

[tool.setuptools]
packages = ["ragkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a live Postgres with pgvector (skipped when DATABASE_URL is unset)",
    "model: downloads the real embedding model (~90 MB); off by default",
]
filterwarnings = ["error::DeprecationWarning:ragkit.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
